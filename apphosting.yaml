# Konfigurasi Firebase App Hosting untuk Bunyi Kata.
#
# App Hosting menjalankan `npm run build` kemudian `npm start`, dan menyuntik
# PORT melalui persekitaran (server.js sudah mematuhinya).
#
# PENTING TENTANG RAHSIA:
#   - Gunakan `secret:` untuk nilai sensitif. Ia disimpan dalam Cloud Secret
#     Manager dan TIDAK pernah masuk ke dalam repo atau bundle pelayar.
#   - Gunakan `value:` hanya untuk nilai yang memang boleh didedahkan.
#   - Pemboleh ubah VITE_* dibundelkan ke dalam JavaScript pelayar, jadi ia
#     mesti availability: BUILD dan TIDAK BOLEH mengandungi rahsia.

runConfig:
  # Nilai konservatif untuk mengawal kos pada pelan Blaze.
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  # ---------------------------------------------------------------------------
  # RUNTIME — pelayan sahaja. Tidak pernah dihantar ke pelayar.
  # ---------------------------------------------------------------------------

  - variable: NODE_ENV
    value: production
    availability:
      - RUNTIME

  # Kod admin. Ditaip dalam kotak kod biasa, disemak oleh POST /api/admin/verify.
  # Daftar dahulu:
  #   firebase apphosting:secrets:set ADMIN_CODE
  - variable: ADMIN_CODE
    secret: ADMIN_CODE
    availability:
      - RUNTIME

  # UID tetap untuk sesi admin (bukan rahsia, tetapi hanya perlu di pelayan).
  - variable: ADMIN_UID
    value: bunyikata-admin
    availability:
      - RUNTIME

  # URL RTDB untuk Firebase Admin SDK di pelayan.
  #
  # WAJIB: getAdminApp() dalam server.js membaca FIREBASE_DATABASE_URL atau
  # VITE_FIREBASE_DATABASE_URL. Kedua-duanya adalah BUILD-only sebelum ini,
  # jadi pada masa RUNTIME databaseURL akan menjadi undefined dan setiap
  # operasi pangkalan data di pelayan akan gagal.
  - variable: FIREBASE_DATABASE_URL
    value: https://bunyi-kata-official-default-rtdb.asia-southeast1.firebasedatabase.app
    availability:
      - RUNTIME

  # ID projek untuk Admin SDK (ADC perlukan ini secara eksplisit).
  - variable: FIREBASE_PROJECT_ID
    value: bunyi-kata-official
    availability:
      - RUNTIME

  # Nota: FIREBASE_SERVICE_ACCOUNT tidak diperlukan di sini.
  # App Hosting menyediakan Application Default Credentials secara automatik,
  # dan getAdminApp() dalam server.js akan menggunakannya.

  # ---------------------------------------------------------------------------
  # BUILD — dibundelkan ke dalam JavaScript pelayar. AWAM. Jangan letak rahsia.
  # ---------------------------------------------------------------------------

  # Kunci API Firebase web. AWAM secara reka bentuk: ia dibundelkan ke dalam
  # JavaScript pelayar dan boleh dibaca oleh sesiapa yang buka View Source.
  # Keselamatan datang daripada database.rules.json, bukan daripada
  # menyembunyikan kunci ini.
  - variable: VITE_FIREBASE_API_KEY
    value: AIzaSyBLVyThW8CWIDyoSpfRzSuhQg2OFcM6SpQ
    availability:
      - BUILD

  - variable: VITE_FIREBASE_AUTH_DOMAIN
    value: bunyi-kata-official.firebaseapp.com
    availability:
      - BUILD

  - variable: VITE_FIREBASE_DATABASE_URL
    value: https://bunyi-kata-official-default-rtdb.asia-southeast1.firebasedatabase.app
    availability:
      - BUILD

  - variable: VITE_FIREBASE_PROJECT_ID
    value: bunyi-kata-official
    availability:
      - BUILD

  - variable: VITE_FIREBASE_STORAGE_BUCKET
    value: bunyi-kata-official.firebasestorage.app
    availability:
      - BUILD

  - variable: VITE_FIREBASE_MESSAGING_SENDER_ID
    value: "275606412587"
    availability:
      - BUILD

  - variable: VITE_FIREBASE_APP_ID
    value: "1:275606412587:web:1429636d9601afa285796e"
    availability:
      - BUILD
